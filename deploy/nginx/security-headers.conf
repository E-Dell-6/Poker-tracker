# Security headers for the PokerFlow SPA vhost.
#
# WHERE THIS GOES
#   Copy to the server, e.g. /etc/nginx/snippets/pokerflow-security-headers.conf
#   then add ONE line inside the server { } block that serves the built
#   frontend (pokerflow.live / www.pokerflow.live):
#
#       include /etc/nginx/snippets/pokerflow-security-headers.conf;
#
#   Then:  sudo nginx -t  &&  sudo systemctl reload nginx
#
# PUT IT ON THE FRONTEND VHOST ONLY.
#   The API (api.pokerflow.live) already sets its own headers via helmet()
#   in src/server.js. Adding these there too would emit some headers twice,
#   and duplicated CSP is intersected by browsers - two policies is stricter
#   than either, which is how a working site suddenly stops loading.
#
# THE add_header INHERITANCE TRAP
#   nginx does NOT merge add_header across levels: if a location { } block
#   contains any add_header of its own, EVERY add_header from the enclosing
#   server { } is discarded inside that location. So if you have a location
#   setting cache headers on static assets, this include must be repeated
#   inside it, or those responses go out bare. Verify per-path, not once:
#
#       curl -sI https://www.pokerflow.live/            | grep -i -E 'content-security|x-frame|strict-transport'
#       curl -sI https://www.pokerflow.live/assets/<a-real-hashed-file>.js | grep -i content-security
#
#   'always' makes these apply to error responses (404/50x) too, which is
#   otherwise a common gap.

# Clickjacking. frame-ancestors in the CSP below is the modern control and
# supersedes this; X-Frame-Options remains for older browsers.
add_header X-Frame-Options "DENY" always;

# Stop the browser second-guessing a declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Don't leak full paths to third parties in the Referer header.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No page here uses these APIs.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS. Only meaningful once TLS terminates here, which it does on this box.
# Browsers ignore it on a plain-HTTP response, so it is safe to send always.
# Add ; preload ONLY if you intend to submit the domain to the preload list
# - it is very hard to reverse, so it is deliberately omitted.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# CSP.
#   script-src needs no 'unsafe-inline': Vite emits hashed .js files and the
#     built index.html carries no inline <script>.
#   style-src DOES need it: lucide-react and recharts both set inline style
#     attributes at runtime.
#   The two font hosts are load-bearing, not boilerplate - src/styles/theme.css
#     @imports Inter and JetBrains Mono from fonts.googleapis.com (a
#     stylesheet, hence style-src), which then pulls woff2 files from
#     fonts.gstatic.com (hence font-src). Drop either and the whole app
#     silently falls back to system fonts.
#   connect-src must name the API origin explicitly - it is a different host,
#     so 'self' alone would block every request the app makes.
#   img-src includes the API origin because profile images are served from
#     /uploads there; blob:/data: cover locally previewed uploads.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://api.pokerflow.live; connect-src 'self' https://api.pokerflow.live; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
