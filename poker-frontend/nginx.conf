server {
    listen 80;

    # Security headers for the HTML the browser actually loads. helmet() on
    # the API covers api.pokerflow.live, but that does nothing for this
    # origin - these pages were being served with no headers at all.
    #
    # always: send these on error responses (404/50x) too, not just 200s.

    # Clickjacking. frame-ancestors is the modern control and CSP below
    # carries it; X-Frame-Options is here for older browsers that ignore it.
    add_header X-Frame-Options "DENY" always;

    # Stop the browser guessing a response is a script/stylesheet when the
    # declared Content-Type says otherwise.
    add_header X-Content-Type-Options "nosniff" always;

    # Don't leak the full path a user came from to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No page here uses the camera, mic, or location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # HSTS. This container listens on plain 80 behind an upstream that
    # terminates TLS; browsers ignore this header on a non-HTTPS response,
    # so sending it unconditionally is safe and it takes effect once the
    # response reaches the client over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP. Vite emits hashed .js/.css files and index.html carries no inline
    # <script>, so script-src needs no 'unsafe-inline'. style-src does:
    # lucide-react and recharts both set inline style attributes at runtime.
    #
    # The two font hosts are load-bearing, not boilerplate: src/styles/theme.css
    # pulls Inter and JetBrains Mono with an @import from fonts.googleapis.com
    # (a stylesheet, hence style-src) which in turn fetches the woff2 files
    # from fonts.gstatic.com (hence font-src). Dropping either one silently
    # falls the whole app back to system fonts.
    #
    # connect-src must name the API origin explicitly - it's a different host
    # from this one, so 'self' alone would block every request the app makes.
    # img-src includes it too, because profile images are served from
    # /uploads there; blob:/data: cover locally previewed uploads.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://api.pokerflow.live; connect-src 'self' https://api.pokerflow.live; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
